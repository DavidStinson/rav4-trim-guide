<!doctype html>
<meta charset="utf-8">
<title>Layout check harness</title>
<style>body{font:14px system-ui;margin:12px}iframe{border:1px solid #ccc;height:900px;display:block;margin:8px 0}</style>
<pre id="out">running…</pre>
<script type="module">
// Loads the site at several widths, for each model year, and runs layout-check.js, year-check.js and
// photo-check.js in each. ?page= picks the page.
const page = new URLSearchParams(location.search).get('page') || '/rav4-site/index.html';
const widths = [390, 700, 1100, 1400, 1500];
const years = [2027, 2026];
const src = await (await fetch('/tools/layout-check.js')).text();
const ysrc = await (await fetch('/tools/year-check.js')).text();
const psrc = await (await fetch('/tools/photo-check.js')).text();
const results = {};
for (const y of years) for (const w of widths) {
  const f = document.createElement('iframe'); f.width = w; f.src = `${page}?year=${y}&t=${Date.now()}`;
  document.body.append(f);
  await new Promise(r => f.onload = r);
  await new Promise(r => setTimeout(r, 400));
  // Any error the page throws or logs while the checks click through it is a failure too.
  const errors = [];
  f.contentWindow.addEventListener('error', e => errors.push(`page error: ${e.message}`));
  f.contentWindow.addEventListener('unhandledrejection', e => errors.push(`page error: ${e.reason}`));
  const log = f.contentWindow.console.error;
  f.contentWindow.console.error = (...a) => { errors.push(`console error: ${a.join(' ')}`); log.apply(f.contentWindow.console, a); };
  f.contentWindow.eval(src); f.contentWindow.eval(ysrc); f.contentWindow.eval(psrc);
  // Year checks change the spec filter, so run the layout checks first.
  results[`${y}@${w}`] = [...f.contentWindow.layoutCheck(), ...f.contentWindow.yearCheck(y), ...await f.contentWindow.photoCheck(), ...new Set(errors)];
  if(!results.files) results.files = await f.contentWindow.photoFilesCheck();
}
window.RESULTS = results;
document.getElementById('out').textContent = JSON.stringify(results, null, 2);
</script>
